# Build and release Rebler.
#
# Every tag turns into a release ZIP with a SHA256 checksum. Runs on the
# same Ubuntu image used locally, so CI output matches a hand build.
#
# Note: the top-of-file comment must stay a real YAML comment (#), not
# plain text — a bare text block here is a YAML parse error and GitHub
# refuses the whole workflow.

on:
  push:
    branches: [ main ]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install JDK + tools
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b
        link-to-system-ndk: true

    - name: Build module ZIP
      run: |
        chmod +x build.sh
        # On tag builds the ZIP/update.json follow the tag, not whatever
        # module.prop says — single-sources the release version.
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          ./build.sh "${{ github.ref_name }}"
        else
          ./build.sh
        fi

    - name: List artifacts
      run: |
        ls -la output/

    - name: Assert installable artifact
      run: |
        python3 -c "import zipfile,sys,glob; z=zipfile.ZipFile(glob.glob('output/*.zip')[0]); sys.exit(0 if 'module.prop' in z.namelist() else 1)" \
          || { echo "module.prop not at ZIP root"; exit 1; }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Rebler
        path: |
          output/*.zip
          output/*.sha256
          output/update.json

    - name: Release on tag
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          output/*.zip
          output/*.sha256
          output/update.json
        body: |
          # Rebler ${{ github.ref_name }}

          See [CHANGELOG.md](https://github.com/who-lee/Rebler/blob/main/CHANGELOG.md) for what is in this release.

          ## Install
          1. Download `Rebler-${{ github.ref_name }}.zip`
          2. Install via Magisk, KernelSU, or APatch
          3. Reboot
          4. Open the WebUI and add any packages you actually want to see root

          Pre-claim: this module ships **no** fake attestation chains.
          If a target app needs Play Integrity **STRONG**, point Rebler at a
          keybox from TrickyStore on **your own device**. The README says so.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
